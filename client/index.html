<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wildora</title>
    <meta name="description" content="Wildora: jogo online gratuito de explorar, capturar e treinar criaturas num mundo 2D compartilhado com outros treinadores." />
    <meta name="theme-color" content="#14161c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #14161c;
        --panel: rgba(16, 18, 24, 0.82);
        --line: rgba(255, 255, 255, 0.12);
        --text: #e9ecf2;
        --muted: #9aa3b2;
        --accent: #ffc914;
        --pixel: "Pixelify Sans", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      button { touch-action: manipulation; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
      #game { position: fixed; inset: 0; }

      #chat { position: fixed; left: 12px; bottom: 12px; width: min(380px, calc(100vw - 24px));
        background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
        padding: 8px; display: none; flex-direction: column; gap: 6px; z-index: 5; }
      #chat input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
        background: rgba(255,255,255,0.08); color: var(--text); font-size: 14px; }
      #chat-log { height: 150px; overflow-y: auto; font-size: 13px; line-height: 1.4; }
      #chat-log .sys { color: var(--muted); font-style: italic; }
      #chat-log b { color: var(--accent); }
      #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: none; z-index: 5;
        gap: 8px; flex-wrap: wrap; align-items: flex-start; pointer-events: none; font-family: var(--pixel); }
      #hud > * { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
        padding: 6px 10px; font-size: 15px; color: var(--muted); }
      #hud b { color: var(--text); }
      #hud .hud-area { color: #ffe066; font-weight: 700; }
      #hud .hud-money { color: #b8f28a; }
      #hud button { pointer-events: auto; cursor: pointer; font-family: var(--pixel); font-weight: 700; color: #1f2430;
        background: #ffd84a; border: 2px solid #1f2430; }
      #hud button:hover { filter: brightness(1.07); }
      #hud button.hud-quiet { background: #c9d2e3; }
      #hud .hud-help { margin-left: auto; font-size: 13px; }
      /* sem mix-blend-mode: no celular ele obriga a recompor a tela inteira a cada quadro */
      #night { position: fixed; inset: 0; pointer-events: none; z-index: 1; background: #0e1640;
        opacity: 0; transition: opacity 4s ease; }
      #night.on { opacity: 0.42; }
      #sound-panel { position: fixed; z-index: 8; width: 220px; display: grid; gap: 8px; padding: 10px 12px;
        background: #f3efe4; color: #1f2430; border: 3px solid #1f2430; border-radius: 10px; box-shadow: 0 4px 0 #0a0d14;
        font-family: var(--pixel); font-size: 15px; }
      #sound-panel[hidden] { display: none; }
      #sound-panel .snd-row { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 8px; }
      #sound-panel input[type=range] { width: 100%; accent-color: #e8692f; }
      #sound-panel .snd-check { display: flex; align-items: center; gap: 8px; }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <div id="login"></div>

    <div id="night"></div>

    <div id="hud">
      <div class="hud-area" id="hud-area">Vila Broto</div>
      <div id="hud-team"></div>
      <div class="hud-money" id="hud-money"></div>
      <button type="button" id="hud-team-btn">Time<span class="kbd"> (T)</span></button>
      <button type="button" id="hud-bag-btn">Mochila<span class="kbd"> (B)</span></button>
      <button type="button" id="hud-sound" class="hud-quiet">Som</button>
      <button type="button" id="hud-logout" class="hud-quiet">Sair</button>
      <div class="hud-help">Setas/WASD andar · E interagir · clique em alguém: batalha/troca · Enter chat · <span id="hud-online">0</span> online <span id="hud-clock"></span></div>
    </div>

    <div id="chat">
      <button type="button" class="chat-close pbtn small ghost">Fechar</button>
      <div id="chat-log"></div>
      <input id="chat-input" maxlength="140" placeholder="Enter para conversar" autocomplete="off" />
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
